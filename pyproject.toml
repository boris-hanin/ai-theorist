[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-theorist"
version = "0.1.0"
description = "Executable DMFT derivations, validation harnesses, and a fixed-horizon neural scaling workbench"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Boris Hanin"}]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.13,<2",
  "torch>=2.2",
]

[project.scripts]
ai-theorist-autoscale = "ai_theorist.autoscaler.cli:main"
ai-theorist-autoscale-api = "ai_theorist.autoscaler.api:main"

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
