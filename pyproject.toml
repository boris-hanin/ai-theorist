[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-theorist"
version = "0.1.0"
description = "Executable DMFT derivations, validation harnesses, and research rounds"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Boris Hanin"}]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.13,<2",
  "torch>=2.2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
